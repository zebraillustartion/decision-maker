<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>命运老虎机</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'pop-black': '#0f0f11',
              'pop-yellow': '#facc15', // yellow-400
              'pop-green': '#4ade80', // green-400
              'pop-pink': '#f472b6', // pink-400
              'pop-blue': '#60a5fa', // blue-400
              'pop-orange': '#fb923c', // orange-400
              'neon-pink': '#ff00ff',
              'neon-purple': '#bf00ff',
            },
            fontFamily: {
              sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'bounce-sm': 'bounce 1s infinite',
              'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flash': 'flash 1s infinite',
              'bulb-flash': 'bulb 1s steps(2, start) infinite',
              'marquee': 'marquee 10s linear infinite',
            },
            keyframes: {
              flash: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.3' },
              },
              bulb: {
                '0%': { opacity: '1', filter: 'brightness(1.5)' },
                '50%': { opacity: '0.5', filter: 'brightness(1)' },
              },
              marquee: {
                '0%': { transform: 'translateX(100%)' },
                '100%': { transform: 'translateX(-100%)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for the slot machine screen */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      body {
        background-color: #0f0f11;
        color: white;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
